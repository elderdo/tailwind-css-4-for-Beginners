<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Sizes</title>
    <script src="https://cdn.tailwindcss.com?jit=true"></script>
  </head>
  <body class="p-10">
    <div id="boxes" class="space-y-4"></div>
    <script>
      // Generate boxes with random widths from 50 to 100
      const container = document.getElementById("boxes");
      for (let size = 50; size <= 100; size += 10) {
        const div = document.createElement("div");
        div.className = `bg-blue-${size}00 h-10`;
        div.textContent = `bg-blue-${size}00`;
        container.append(div);
      }
    </script>
    <a href="notification.html">Notification</a>
  </body>
</html>
