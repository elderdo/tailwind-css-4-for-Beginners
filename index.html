<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Learning Dashboard</title>
    <!-- Using standard Tailwind CDN just for the root dashboard to keep it simple -->
    <script src="https://tailwindcss.com"></script>
    <!-- Trick Vite into watching this file by giving it a script to track -->
    <script type="module" src=""></script>
  </head>
  <body
    class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6"
  >
    <div class="max-w-xl w-full text-center">
      <h1
        class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-blue-500 mb-2"
      >
        JavaScript & Tailwind Study Lab
      </h1>
      <p class="text-slate-400 mb-8">
        Select a chapter below to launch your experiment with hot reloads.
      </p>

      <!-- Grid Layout for Chapters -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Chapter 1 Button -->
        <a
          href="./src/ch01/index.html"
          class="group block p-6 bg-slate-800 rounded-xl border border-slate-700 hover:border-teal-500 transition-all duration-200 text-left shadow-lg hover:shadow-teal-500/10"
        >
          <h2
            class="text-xl font-bold text-teal-400 group-hover:text-teal-300 mb-1"
          >
            Chapter 01
          </h2>
          <p class="text-sm text-slate-400">
            Getting Started with Tailwind CSS 4
          </p>
        </a>

        <!-- Chapter 2 Placeholder (Add more as you progress!) -->
        <a
          href="./src/ch02/index.html"
          class="group block p-6 bg-slate-800/50 rounded-xl border border-slate-800/80 hover:border-blue-500 transition-all duration-200 text-left opacity-60 hover:opacity-100"
        >
          <h2 class="text-xl font-bold text-blue-400 mb-1">Chapter 02</h2>
          <p class="text-sm text-slate-500">Core Utility Classes</p>
        </a>
      </div>
    </div>
  </body>
</html>
